<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spooky Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0614; --panel:#1b0f2c; --panel2:#261541; --orange:#ff7a1a; --soft:#ffb273; --purple:#8e3bd6; --green:#9be564; --text:#f3e9ff; --muted:#a99bc4; --line:#3a2357; }
  *{box-sizing:border-box}
  :root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0;min-height:100%}
  body{font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);min-height:100vh;
    background:radial-gradient(circle at 15% 0%,rgba(255,122,26,.2),transparent 40%),radial-gradient(circle at 85% 15%,rgba(142,59,214,.25),transparent 45%),linear-gradient(180deg,#140a24,var(--bg));
    background-attachment:fixed;overflow-x:hidden}
  .float{position:fixed;pointer-events:none;opacity:.14;font-size:28px;animation:drift linear infinite;z-index:0;bottom:-60px}
  @keyframes drift{from{transform:translateY(0) rotate(0)}to{transform:translateY(-120vh) rotate(360deg)}}
  .wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:24px 16px 70px}
  header{text-align:center;padding:14px 0 6px}
  h1{font-family:"Creepster","Impact",cursive;font-weight:400;font-size:clamp(46px,9vw,90px);margin:0;color:var(--orange);letter-spacing:1px;text-shadow:0 0 14px rgba(255,122,26,.6),3px 3px 0 #3b1a05;animation:flicker 4s infinite}
  @keyframes flicker{0%,100%{opacity:1}47%{opacity:1}50%{opacity:.82}52%{opacity:1}}
  .sub{color:var(--muted);font-weight:900;letter-spacing:4px;text-transform:uppercase;font-size:12px;margin-top:6px}
  nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:18px 0 22px}
  nav button{font:900 15px "Nunito",sans-serif;background:var(--panel);color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:10px 18px;cursor:pointer;transition:.15s}
  nav button:hover{color:var(--text);border-color:var(--purple)}
  nav button.on{background:linear-gradient(135deg,var(--orange),#d9480f);color:#1b0a00;border-color:var(--orange);box-shadow:0 0 18px rgba(255,122,26,.45)}
  .card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
  h2{font-family:"Creepster",cursive;font-weight:400;font-size:34px;margin:0 0 6px;color:var(--soft);letter-spacing:1px}
  .hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0 0 14px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .sp{justify-content:space-between}
  input,select,textarea{font:700 15px "Nunito",sans-serif;background:#12091f;color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 13px;outline:none;min-width:0}
  input:focus,select:focus,textarea:focus{border-color:var(--orange)}
  .grow{flex:1 1 180px}
  .num{width:84px;text-align:center}
  .age{width:96px}
  .btn{font:900 15px "Nunito",sans-serif;border:none;border-radius:12px;padding:11px 18px;cursor:pointer;background:var(--purple);color:#fff;transition:transform .1s,filter .15s}
  .btn:hover{filter:brightness(1.12)} .btn:active{transform:scale(.97)}
  .btn.or{background:linear-gradient(135deg,var(--orange),#d9480f);color:#1b0a00}
  .btn.gh{background:transparent;border:2px solid var(--line);color:var(--muted)}
  .btn.rd{background:transparent;border:2px solid #7a2230;color:#ff8a9a;padding:7px 12px;font-size:13px}
  .btn.sm{padding:7px 12px;font-size:13px}
  .list{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:10px}
  .list li{display:flex;align-items:center;gap:12px;background:#12091f;border:1px solid var(--line);border-radius:14px;padding:10px 14px;flex-wrap:wrap}
  .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:radial-gradient(circle,#ff9a3c,#7b2cbf);flex-shrink:0}
  .pn{font-weight:900;font-size:17px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:12px;font-weight:900;padding:4px 10px;border-radius:999px;background:rgba(255,122,26,.18);color:var(--soft)}
  .empty{text-align:center;color:var(--muted);padding:28px 10px}
  .empty span{font-size:42px;display:block;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .act{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:.15s}
  .act:hover{transform:translateY(-4px);border-color:var(--orange);box-shadow:0 14px 30px rgba(255,122,26,.18)}
  .act .ic{font-size:40px;transition:transform .3s}
  .act:hover .ic{transform:rotate(-8deg) scale(1.1)}
  .act .ti{font-family:"Creepster",cursive;font-size:27px;line-height:1.05;letter-spacing:1px}
  .act .nt{font-size:13px;color:var(--muted);font-weight:700}
  .act .win{font-size:13px;color:var(--green);font-weight:900;margin-top:auto}
  .act .ok{position:absolute;top:12px;right:14px;font-size:12px;font-weight:900;color:var(--green)}
  .rules{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .chip{font-size:12px;background:#12091f;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--text)}
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;margin:10px 0 26px;min-height:190px}
  .step{width:31%;max-width:200px;border-radius:16px 16px 6px 6px;padding:14px 8px;text-align:center;background:linear-gradient(180deg,#3a2357,#1b0f2c);border:1px solid var(--line);animation:rise .7s ease both}
  .step.p1{background:linear-gradient(180deg,#ff9a3c,#8a3a0c);height:190px;color:#1b0a00;box-shadow:0 0 30px rgba(255,122,26,.4)}
  .step.p2{height:150px}
  .step.p3{height:118px}
  .step .medal{font-size:30px}
  .step .sn{font-weight:900;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .step .sp2{font-family:"Creepster",cursive;font-size:30px}
  @keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--muted)}
  .r{text-align:right}
  .rk{font-family:"Creepster",cursive;font-size:26px;width:54px}
  .tot{font-size:22px;font-weight:900;color:var(--orange)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .overlay{position:fixed;inset:0;background:rgba(5,2,10,.8);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:flex-start;padding:24px 14px;overflow-y:auto;z-index:50}
  .modal{width:100%;max-width:640px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--orange);border-radius:22px;padding:24px;box-shadow:0 0 40px rgba(255,122,26,.25);animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.95);opacity:0}to{transform:none;opacity:1}}
  .mh{display:flex;align-items:center;gap:12px}
  .mh .ic{font-size:38px}
  .sc{display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:8px;background:#12091f;border:2px solid var(--line);border-radius:14px;cursor:pointer;user-select:none;transition:.15s}
  .sc.pk{border-color:var(--orange)}
  .pl{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:"Creepster",cursive;font-size:22px;background:#2a1a40;color:var(--muted);flex-shrink:0}
  .sc.pk .pl{background:var(--orange);color:#1b0a00}
  .sc .inf{flex:1;min-width:0}
  .sc .mu{font-size:12px;color:var(--soft);font-weight:900}
  .foot{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--orange);color:#1b0a00;font-weight:900;padding:12px 22px;border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
  .toast.show{opacity:1}
  .ev{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
  .evc{background:#12091f;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
  .evc .media{width:100%;aspect-ratio:4/3;background:#000;display:grid;place-items:center;color:var(--muted);font-size:40px}
  .evc .media img,.evc .media video{width:100%;height:100%;object-fit:cover}
  .evc .body{padding:12px;display:flex;flex-direction:column;gap:8px}
  .evc textarea{width:100%;font-size:14px;resize:vertical}
  .evc code{font-size:11px;color:var(--soft);word-break:break-all;user-select:all}
  .sep{height:1px;background:var(--line);margin:20px 0}
  @media (max-width:560px){.card{padding:16px}.step{width:30%}.step.p1{height:160px}.step.p2{height:125px}.step.p3{height:100px}}
</style>
</head>
<body>
<div id="floaters"></div>
<div class="wrap">
  <header>
    <h1>Spooky Showdown</h1>
    <div class="sub">🦇 Halloween Tournament 🎃</div>
  </header>
  <nav id="nav"></nav>
  <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
const PLACE_PTS = [10, 7, 5, 3, 2], DEFAULT_PT = 1, UNDER_AGE = 7, MAX_BYTES = 20 * 1024 * 1024;
const ACTS = [
  { id:'tf', name:'Table Football', icon:'⚽', note:'Head to head' },
  { id:'fifa', name:'FIFA 2024', icon:'🎮', note:'Head to head' },
  { id:'gt7', name:'Gran Turismo 7', icon:'🏎️', note:'Race placings' },
  { id:'laser', name:'Laser Guns', icon:'🔫', note:'Scored from tablet photo', judged:'laser' },
  { id:'memory', name:'Memory Game', icon:'🧠', note:'Most matches / fastest' },
  { id:'garden', name:'Football in the Garden', icon:'🥅', note:'Under 7s get 2× points', double:true },
  { id:'clock', name:'Guess the Clock', icon:'🕰️', note:'Closest guess wins' },
  { id:'draw', name:'Drawing Competition', icon:'🎨', note:'Judged from pictures', judged:'draw' },
  { id:'dance', name:'Best Dancing', icon:'💃', note:'Judged from video', judged:'dance' }
];
const CATS = { laser:'Laser Guns', draw:'Drawing Competition', dance:'Best Dancing' };
const AVATARS = ['🧛','🧟','🧙','👻','🎃','🦇','🕷️','🐈‍⬛','💀','🧝','🦹','🤡'];
const SAVE_KEY = 'spooky-showdown-v2';

let S = { players:[], results:{}, evidence:[] };
let ui = { tab:'players', draft:null, armReset:false };
let nextId = 1;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const actById = id => ACTS.find(a => a.id === id);
const pById = id => S.players.find(p => p.id === id);

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) S = Object.assign(S, JSON.parse(raw));
    const ids = S.players.map(p => parseInt(String(p.id).slice(1), 10) || 0);
    nextId = Math.max(0, ...ids) + 1;
  } catch (e) {}
}
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {}
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2000);
}
const mult = (actId, p) => (actById(actId)?.double && p.age !== '' && p.age < UNDER_AGE) ? 2 : 1;
const isUnder7 = p => p.age !== '' && p.age < UNDER_AGE;

function totals() {
  return S.players.map(p => {
    const breakdown = ACTS.filter(a => S.results[a.id]?.[p.id] !== undefined)
      .map(a => ({ name:a.name, icon:a.icon, pts:S.results[a.id][p.id] }));
    return { p, total: breakdown.reduce((s, b) => s + b.pts, 0), breakdown };
  }).sort((a, b) => b.total - a.total);
}

/* ---------- NAV ---------- */
function setTab(t) { ui.tab = t; render(); }
function renderNav() {
  const tabs = [['players','👥 Players'],['activities','🎯 Activities'],['evidence','📸 Evidence'],['board','🏆 Leaderboard']];
  $('#nav').innerHTML = tabs.map(([k,l]) => `<button class="${ui.tab===k?'on':''}" onclick="setTab('${k}')">${l}</button>`).join('');
}

/* ---------- PLAYERS ---------- */
function addPlayer() {
  const name = $('#pn').value.trim();
  const ageRaw = $('#pa').value.trim();
  if (!name) return toast('Give your player a name 👻');
  if (S.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return toast('That name is already joining');
  const age = ageRaw === '' ? '' : Math.min(120, Math.max(0, parseInt(ageRaw, 10)));
  S.players.push({ id:'p' + (nextId++), name, age: isNaN(age) ? '' : age });
  save(); toast(`${name} has joined the hunt 🎃`); render();
  setTimeout(() => $('#pn')?.focus(), 0);
}
function removePlayer(id) {
  S.players = S.players.filter(p => p.id !== id);
  for (const a in S.results) delete S.results[a][id];
  save(); render();
}
function setAge(id, v) {
  const p = pById(id); if (!p) return;
  const n = parseInt(v, 10); p.age = isNaN(n) ? '' : Math.min(120, Math.max(0, n));
  save(); render();
}
function viewPlayers() {
  const list = S.players.map((p, i) => `
    <li>
      <div class="av">${AVATARS[i % AVATARS.length]}</div>
      <div class="pn">${esc(p.name)}</div>
      ${isUnder7(p) ? '<span class="tag">Under 7 · 2× garden</span>' : ''}
      <input type="number" class="age" min="0" max="120" placeholder="Age" value="${p.age}" onchange="setAge('${p.id}',this.value)">
      <button class="btn rd" onclick="removePlayer('${p.id}')">Remove</button>
    </li>`).join('');
  return `
    <section class="card">
      <h2>Who's Joining?</h2>
      <p class="hint">Add everyone taking part. Age is optional, but anyone <b>under 7</b> earns double points in Football in the Garden.</p>
      <div class="row">
        <input id="pn" class="grow" placeholder="Player name" maxlength="24" onkeydown="if(event.key==='Enter')addPlayer()">
        <input id="pa" class="age" type="number" min="0" max="120" placeholder="Age" onkeydown="if(event.key==='Enter')addPlayer()">
        <button class="btn or" onclick="addPlayer()">+ Add player</button>
      </div>
      ${S.players.length ? `<ul class="list">${list}</ul>` :
        `<div class="empty"><span>🕸️</span>No one has joined yet. Who dares enter?</div>`}
      ${S.players.length ? `<div class="sep"></div><div class="row sp">
        <span class="hint" style="margin:0">${S.players.length} player${S.players.length===1?'':'s'} ready</span>
        <button class="btn gh sm" onclick="setTab('activities')">Go to activities →</button></div>` : ''}
    </section>`;
}

/* ---------- ACTIVITIES ---------- */
function viewActivities() {
  if (!S.players.length) return `<section class="card"><div class="empty"><span>🎃</span>Add players first.<br><br><button class="btn or" onclick="setTab('players')">Add players</button></div></section>`;
  const cards = ACTS.map(a => {
    const sc = S.results[a.id];
    const w = sc && Object.keys(sc).length ? pById(Object.keys(sc).sort((x,y)=>sc[y]-sc[x])[0]) : null;
    return `<div class="act" onclick="openScore('${a.id}')">
      ${sc ? '<span class="ok">✓ Scored</span>' : ''}
      <div class="ic">${a.icon}</div>
      <div class="ti">${esc(a.name)}</div>
      <div class="nt">${esc(a.note)}</div>
      <div class="win">${w ? '🏆 ' + esc(w.name) : 'Tap to score'}</div></div>`;
  }).join('');
  return `
    <section class="card" style="margin-bottom:16px">
      <h2>Activities</h2>
      <p class="hint">Tap players in finishing order to award places automatically. Any number can be typed over by hand.</p>
      <div class="rules"><span class="chip">1st 10</span><span class="chip">2nd 7</span><span class="chip">3rd 5</span><span class="chip">4th 3</span><span class="chip">5th 2</span><span class="chip">others 1</span><span class="chip">🥅 under 7s × 2</span></div>
    </section>
    <div class="grid">${cards}</div>`;
}

function openScore(actId) {
  const existing = S.results[actId] || {};
  const base = {};
  S.players.forEach(p => base[p.id] = existing[p.id] !== undefined ? existing[p.id] / mult(actId, p) : 0);
  const order = Object.keys(existing).filter(id => pById(id)).sort((a,b) => existing[b]-existing[a]);
  ui.draft = { actId, order, base };
  renderModal();
}
function closeModal() { ui.draft = null; $('#modalRoot').innerHTML = ''; }
function togglePick(pid) {
  const d = ui.draft;
  if (d.order.includes(pid)) { d.order = d.order.filter(x => x !== pid); d.base[pid] = 0; }
  else { d.order.push(pid); d.base[pid] = PLACE_PTS[d.order.length-1] ?? DEFAULT_PT; }
  renderModal();
}
function setBase(pid, v) { const n = parseFloat(v); ui.draft.base[pid] = isNaN(n) ? 0 : Math.max(0, n); }
function clearDraft() { ui.draft.order = []; S.players.forEach(p => ui.draft.base[p.id] = 0); renderModal(); }
function saveDraft() {
  const d = ui.draft, act = actById(d.actId);
  const out = {};
  S.players.forEach(p => {
    const pts = (d.base[p.id] || 0) * mult(d.actId, p);
    if (pts > 0 || d.order.includes(p.id)) out[p.id] = Math.round(pts * 10) / 10;
  });
  if (Object.keys(out).length) S.results[d.actId] = out; else delete S.results[d.actId];
  save(); closeModal(); render(); toast(`${act.name} saved 🎉`);
}
function renderModal() {
  const d = ui.draft; if (!d) return;
  const act = actById(d.actId);
  const rows = S.players.map(p => {
    const idx = d.order.indexOf(p.id), on = idx !== -1;
    return `<div class="sc ${on?'pk':''}" onclick="togglePick('${p.id}')">
      <div class="pl">${on ? idx+1 : '–'}</div>
      <div class="inf"><div class="pn">${esc(p.name)}</div>${mult(d.actId,p)===2 ? '<div class="mu">Under 7 · points doubled</div>' : ''}</div>
      <input class="num" type="number" min="0" step="0.5" value="${d.base[p.id]||0}" onclick="event.stopPropagation()" oninput="setBase('${p.id}',this.value)" aria-label="Points for ${esc(p.name)}"></div>`;
  }).join('');
  $('#modalRoot').innerHTML = `
    <div class="overlay" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="mh"><span class="ic" style="font-size:38px">${act.icon}</span><h2 style="margin:0">${esc(act.name)}</h2></div>
        <p class="hint" style="margin:8px 0 14px">${esc(act.note)}. Tap players in finishing order (${PLACE_PTS.join(', ')}, then 1 each), or type points directly.</p>
        ${rows || '<div class="empty">No players yet</div>'}
        <div class="foot"><button class="btn gh sm" onclick="clearDraft()">Clear</button>
          <div class="row"><button class="btn gh" onclick="closeModal()">Cancel</button><button class="btn or" onclick="saveDraft()">Save results 🎃</button></div></div>
      </div>
    </div>`;
}

/* ---------- EVIDENCE ---------- */
async function getAssets() { try { return window.claude ? await window.claude.use('assets') : null; } catch (e) { return null; } }
async function uploadEvidence() {
  const file = $('#ef').files[0], who = $('#ew').value.trim() || 'Unnamed entry', cat = $('#ec').value;
  if (!file) return toast('Pick a photo or video first');
  if (file.size > MAX_BYTES) return toast('That file is over 20 MB. Trim it and try again');
  const assets = await getAssets();
  if (!assets) return toast('Uploads are not available for this viewer');
  toast('Uploading…');
  try {
    const r = await assets.upload(file);
    S.evidence.unshift({ id:r.id, url:r.url, type:r.contentType || file.type, cat, who, name:file.name, verdict:'' });
    save(); render(); toast('Uploaded ✓');
  } catch (e) { toast('Upload failed: ' + (e?.message || 'try a smaller file')); }
}
function setVerdict(i, v) { if (S.evidence[i]) { S.evidence[i].verdict = v; save(); } }
function removeEvidence(i) { S.evidence.splice(i, 1); save(); render(); }
function viewEvidence() {
  const opts = Object.entries(CATS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
  const cards = S.evidence.map((e, i) => {
    const media = e.url && String(e.type).startsWith('video')
      ? `<video src="${esc(e.url)}" controls playsinline></video>`
      : e.url && String(e.type).startsWith('image')
        ? `<img src="${esc(e.url)}" alt="${esc(e.who)}">`
        : `<span>📎</span>`;
    return `<div class="evc"><div class="media">${media}</div>
      <div class="body">
        <div class="row sp"><b>${esc(e.who)}</b><span class="tag">${esc(CATS[e.cat])}</span></div>
        <textarea rows="2" placeholder="Judge's notes / verdict" onchange="setVerdict(${i},this.value)">${esc(e.verdict)}</textarea>
        <code>${esc(e.id)}</code>
        <button class="btn rd sm" onclick="removeEvidence(${i})">Delete</button>
      </div></div>`;
  }).join('');
  const codes = S.evidence.map(e => `${CATS[e.cat]} | ${e.who} | ${e.id}`).reverse().join('\n');
  return `
    <section class="card">
      <h2>Evidence Locker</h2>
      <p class="hint">Upload laser gun photos, drawings or dance clips (max 20 MB each). Then paste the codes below into the chat so the judging can happen.</p>
      <div class="row">
        <select id="ec">${opts}</select>
        <input id="ew" class="grow" placeholder="Player or team name" maxlength="30">
      </div>
      <div class="row" style="margin-top:10px">
        <input id="ef" type="file" accept="image/*,video/*" style="color:var(--muted)">
        <button class="btn or" onclick="uploadEvidence()">Upload</button>
      </div>
      ${S.evidence.length ? `<div class="ev">${cards}</div>
        <div class="sep"></div>
        <p class="hint">Codes to paste into the chat:</p>
        <textarea readonly rows="${Math.min(S.evidence.length+1,8)}" style="width:100%;font-family:monospace;font-size:13px">${esc(codes)}</textarea>`
        : `<div class="empty"><span>📸</span>No evidence uploaded yet.</div>`}
    </section>`;
}

/* ---------- LEADERBOARD ---------- */
function viewBoard() {
  if (!S.players.length) return `<section class="card"><div class="empty"><span>🏆</span>No players yet.</div></section>`;
  const t = totals();
  const scored = ACTS.filter(a => S.results[a.id]).length;
  const top = t.slice(0, 3);
  const order = [top[1], top[0], top[2]].filter(Boolean);
  const podium = top.length && top[0].total > 0 ? `
    <div class="podium">${order.map(r => {
      const rank = t.indexOf(r) + 1;
      const cls = rank === 1 ? 'p1' : rank === 2 ? 'p2' : 'p3';
      const medal = rank === 1 ? '🎃' : rank === 2 ? '🦇' : '👻';
      return `<div class="step ${cls}"><div class="medal">${medal}</div><div class="sn">${esc(r.p.name)}</div><div class="sp2">${r.total}</div></div>`;
    }).join('')}</div>` : '';
  const rows = t.map((r, i) => `<tr>
      <td class="rk">${i+1}</td>
      <td><div class="pn" style="font-size:18px">${esc(r.p.name)}</div>
        <div class="chips">${r.breakdown.length ? r.breakdown.map(b => `<span class="chip">${b.icon} ${esc(b.name)}: ${b.pts}</span>`).join('') : '<span class="chip">no scores yet</span>'}</div></td>
      <td class="r"><span class="tot">${r.total}</span></td></tr>`).join('');
  return `
    <section class="card">
      <h2>Leaderboard</h2>
      <p class="hint">${scored} of ${ACTS.length} activities scored.</p>
      ${podium}
      <table><thead><tr><th>#</th><th>Player</th><th class="r">Points</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="sep"></div>
      <div class="row sp">
        <span class="hint" style="margin:0">Progress is saved in this browser.</span>
        <button class="btn rd" onclick="resetAll()">${ui.armReset ? 'Tap again to confirm' : 'Reset tournament'}</button>
      </div>
    </section>`;
}
function resetAll() {
  if (!ui.armReset) {
    ui.armReset = true; render(); toast('Tap Reset again to clear everything');
    clearTimeout(resetAll._t);
    resetAll._t = setTimeout(() => { ui.armReset = false; if (ui.tab === 'board') render(); }, 4000);
    return;
  }
  clearTimeout(resetAll._t); ui.armReset = false;
  S = { players:[], results:{}, evidence:[] }; ui.tab = 'players';
  save(); render(); toast('Tournament reset 🦇');
}

/* ---------- RENDER ---------- */
function render() {
  renderNav();
  const views = { players:viewPlayers, activities:viewActivities, evidence:viewEvidence, board:viewBoard };
  $('#main').innerHTML = views[ui.tab]();
}
function floaters() {
  const items = ['🦇','🎃','👻','🕷️','🕸️','🦉'];
  $('#floaters').innerHTML = Array.from({length:14}, (_, i) =>
    `<span class="float" style="left:${(i*7.3)%100}%;animation-duration:${22+(i%5)*6}s;animation-delay:${-(i*3)}s">${items[i%items.length]}</span>`).join('');
}

load(); floaters(); render();
</script>
</body>
</html>
